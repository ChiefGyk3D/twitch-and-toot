# Snyk Security Scanning
#
# This workflow performs comprehensive security scanning using Snyk:
# - Snyk Code (SAST): Static application security testing for code vulnerabilities
# - Snyk Open Source (SCA): Software composition analysis for dependency vulnerabilities
#
# Runs on:
# - Pull requests to main/develop branches
# - Weekly schedule (Mondays at 00:00 UTC)
# - Manual trigger via workflow_dispatch
#
# Results are uploaded to GitHub Security > Code Scanning tab

name: Snyk Security Scanning

on:
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Snyk CLI
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip>=25.3"
        pip install -r requirements.txt

    - name: Snyk Code test (SAST)
      run: snyk code test --sarif > snyk-code.sarif || true
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Snyk Open Source test (SCA)
      run: snyk test --all-projects --severity-threshold=high --sarif > snyk-opensource.sarif || true
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Upload Snyk Code results
      uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
      if: always()
      with:
        sarif_file: snyk-code.sarif
        category: snyk-code

    - name: Upload Snyk Open Source results
      uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
      if: always()
      with:
        sarif_file: snyk-opensource.sarif
        category: snyk-opensource
