# Pull Request Dependency Review
#
# This workflow reviews dependency changes in pull requests to detect:
# - New dependencies added
# - Version changes in existing dependencies
# - Known vulnerabilities in added/updated dependencies
# - License compatibility issues
#
# Runs on:
# - Pull requests to main/develop branches
#
# Behavior:
# - Fails PR if vulnerabilities with severity >= moderate are detected
# - Posts a summary comment in the PR with findings

name: PR Dependency Review

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review PR Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Review dependency changes
      uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      with:
        fail-on-severity: moderate
        comment-summary-in-pr: true
